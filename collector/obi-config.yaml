discovery:
  # The final VM is dedicated to ORBITAL. Restrict discovery to OCI containers
  # listening on the application's internal port; host processes are excluded.
  instrument:
    - open_ports: "8000"
      containers_only: true
  # PARALLAX intentionally needs an independent plane in addition to SDK spans.
  exclude_otel_instrumented_services: false

ebpf:
  context_propagation: all

otel_traces_export:
  endpoint: http://otel-collector:4318

otel_metrics_export:
  endpoint: http://otel-collector:4318

metrics:
  features:
    - application
    - application_service_graph
    - network

log_level: INFO
trace_printer: disabled
