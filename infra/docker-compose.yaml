x-service: &python-service
  build:
    context: ..
    dockerfile: infra/Dockerfile.service
  env_file:
    - path: ../.env
      required: false
  restart: unless-stopped
  networks: [orbital]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    otel-collector: { condition: service_healthy }
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >-
        import urllib.request;
        urllib.request.urlopen('http://localhost:8000/health', timeout=2)
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbital
      POSTGRES_PASSWORD: orbital
      POSTGRES_DB: orbital
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbital"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    networks: [orbital]

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["redis-data:/data"]
    networks: [orbital]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: orbital
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-orbital-development-secret}
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["minio-data:/data"]
    networks: [orbital]

  opa:
    image: openpolicyagent/opa:1.7.1-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-format=json", "/policies"]
    volumes: ["../policies:/policies:ro"]
    ports: ["8181:8181"]
    healthcheck:
      test: ["CMD", "/opa", "eval", "true"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [orbital]

  ollama:
    image: ollama/ollama:0.11.2
    profiles: ["local-llm"]
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes: ["ollama-data:/root/.ollama"]
    ports: ["11434:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [orbital]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      # The Collector shares Foundry's network and must never resolve through the host.
      SIGNOZ_OTLP_ENDPOINT: ingester:4317
    volumes: ["../collector/collector-config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["14317:4317", "14318:4318", "13133:13133"]
    networks: [orbital, signoz]
    healthcheck:
      test:
        [
          "CMD",
          "/otelcol-contrib",
          "validate",
          "--config=/etc/otelcol/config.yaml",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  signoz-mcp:
    image: signoz/signoz-mcp-server:latest
    environment:
      TRANSPORT_MODE: http
      MCP_SERVER_PORT: 8000
      SIGNOZ_URL: http://orbital-signoz-0:8080
      SIGNOZ_API_KEY: ${SIGNOZ_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: info
    ports: ["18000:8000"]
    depends_on: [otel-collector]
    networks: [orbital, signoz]

  control-plane:
    <<: *python-service
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: control-plane } }
    ports: ["8001:8000"]

  agent-runtime:
    <<: *python-service
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: agent-runtime } }
    environment:
      DATABASE_URL: postgresql+psycopg://orbital:orbital@postgres:5432/orbital
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      EVIDENCE_RECONCILER_URL: http://evidence-reconciler:8000
      ACTION_GATEWAY_URL: http://action-gateway:8000
      CERTIFIER_URL: http://certifier:8000
      OPA_URL: http://opa:8181
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
    ports: ["8002:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      otel-collector: { condition: service_healthy }
      opa: { condition: service_healthy }
      action-gateway: { condition: service_healthy }
      certifier: { condition: service_healthy }

  mock-mcp-tool:
    <<: *python-service
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: agent-runtime } }
    command: ["sh", "-c", "cd /workspace/services/agent-runtime && uvicorn mock_tool:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://orbital:orbital@postgres:5432/orbital
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: orbital-mock-mcp-tool
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=orbital-sigma,deployment.environment=local
      REFUND_FIXTURE_URL: http://mock-refund-service:8000
      LOCAL_FIXTURE_KEY: ${LOCAL_FIXTURE_KEY:-orbital-local-fixture}
    ports: ["8011:8000"]

  mock-refund-service:
    <<: *python-service
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: action-gateway } }
    command: ["sh", "-c", "cd /workspace/services/action-gateway && uvicorn mock_refund:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://orbital:orbital@postgres:5432/orbital
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: orbital-mock-refund-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=orbital-sigma,deployment.environment=local
      LOCAL_FIXTURE_KEY: ${LOCAL_FIXTURE_KEY:-orbital-local-fixture}
      EFFECT_RECEIPT_SIGNING_KEY: /workspace/secrets/effect-receipt.key
    volumes: ["../secrets:/workspace/secrets"]
    ports: ["8012:8000"]

  action-gateway:
    <<: *python-service
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: action-gateway } }
    volumes: ["../secrets:/workspace/secrets"]
    ports: ["8003:8000"]

  evidence-reconciler:
    <<: *python-service
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: evidence-reconciler } }
    environment:
      DATABASE_URL: postgresql+psycopg://orbital:orbital@postgres:5432/orbital
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      SIGNOZ_CLICKHOUSE_URL: http://orbital-telemetrystore-clickhouse-0-0:8123
      SIGNOZ_PUBLIC_URL: http://localhost:8080
      OPA_URL: http://opa:8181
    networks: [orbital, signoz]
    ports: ["8004:8000"]

  capsule-builder:
    <<: *python-service
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: capsule-builder } }
    volumes: ["../missions:/workspace/missions"]
    ports: ["8005:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      otel-collector: { condition: service_healthy }

  replay-orchestrator:
    <<: *python-service
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: replay-orchestrator } }
    ports: ["8006:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      otel-collector: { condition: service_healthy }

  replay-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args: { SERVICE: replay-orchestrator }
    env_file:
      - path: ../.env
        required: false
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "cd /workspace/services/replay-orchestrator && celery -A worker.app worker --loglevel=INFO --concurrency=${REPLAY_WORKER_CONCURRENCY:-4}",
      ]
    networks: [orbital]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      otel-collector: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cd /workspace/services/replay-orchestrator && celery -A worker.app inspect ping --destination celery@$$HOSTNAME --timeout 3 | grep -q pong",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  adversarial-foundry:
    <<: *python-service
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: adversarial-foundry } }
    ports: ["8007:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      otel-collector: { condition: service_healthy }

  causal-engine:
    <<: *python-service
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: causal-engine } }
    volumes: ["../missions:/workspace/missions"]
    ports: ["8008:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      otel-collector: { condition: service_healthy }

  causal-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.service
      args: { SERVICE: causal-engine }
    env_file:
      - path: ../.env
        required: false
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "cd /workspace/services/causal-engine && celery -A worker.app worker --loglevel=INFO --queues=causal --concurrency=${CAUSAL_WORKER_CONCURRENCY:-4}",
      ]
    volumes: ["../missions:/workspace/missions"]
    networks: [orbital]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      otel-collector: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cd /workspace/services/causal-engine && celery -A worker.app inspect ping --destination celery@$$HOSTNAME --timeout 3 | grep -q pong",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  certifier:
    <<: *python-service
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: certifier } }
    environment:
      DATABASE_URL: postgresql+psycopg://orbital:orbital@postgres:5432/orbital
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-orbital}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-orbital-development-secret}
      MINIO_BUCKET: orbital-sigma
      CERTIFICATE_SIGNING_KEY: /workspace/secrets/certificate.key
      CERTIFICATE_PUBLIC_KEY: /workspace/secrets/certificate.pub
    volumes: ["../secrets:/workspace/secrets"]
    ports: ["8009:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      otel-collector: { condition: service_healthy }

  watchtower:
    <<: *python-service
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: watchtower } }
    environment:
      SIGNOZ_PUBLIC_URL: http://localhost:8080
    ports: ["8010:8000"]
    networks: [orbital, signoz]

  watchtower-relay:
    <<: *python-service
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: watchtower } }
    command: ["sh", "-c", "cd /workspace/services/watchtower && uvicorn relay:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://orbital:orbital@postgres:5432/orbital
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      WATCHTOWER_URL: http://watchtower:8000
      ORBITAL_WEBHOOK_SECRET: ${ORBITAL_WEBHOOK_SECRET:-development-only}
      SIGNOZ_PUBLIC_URL: http://localhost:8080
    depends_on:
      watchtower: { condition: service_healthy }
      otel-collector: { condition: service_healthy }
    networks: [orbital, signoz]

  mission-control:
    build:
      context: ..
      dockerfile: apps/mission-control/Dockerfile
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
      AGENT_RUNTIME_URL: http://agent-runtime:8000
      EVIDENCE_RECONCILER_URL: http://evidence-reconciler:8000
      WATCHTOWER_URL: http://watchtower:8000
      CAUSAL_ENGINE_URL: http://causal-engine:8000
      CERTIFIER_URL: http://certifier:8000
      SIGNOZ_PUBLIC_URL: http://localhost:8080
    ports: ["3000:3000"]
    depends_on:
      control-plane: { condition: service_healthy }
      evidence-reconciler: { condition: service_healthy }
      watchtower: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/snapshot').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [orbital]

  mission-control-e2e:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: apps/mission-control/Dockerfile.e2e
    environment:
      PLAYWRIGHT_BASE_URL: http://mission-control:3000
    depends_on:
      mission-control: { condition: service_healthy }
    networks: [orbital]

  demo-runner:
    <<: *python-service
    profiles: ["tools"]
    build: { context: .., dockerfile: infra/Dockerfile.service, args: { SERVICE: control-plane } }
    restart: "no"
    command: ["python", "/workspace/demo/run_hero_demo.py", "--phase", "all"]
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
      AGENT_RUNTIME_URL: http://agent-runtime:8000
      ACTION_GATEWAY_URL: http://action-gateway:8000
      EVIDENCE_RECONCILER_URL: http://evidence-reconciler:8000
      CAPSULE_BUILDER_URL: http://capsule-builder:8000
      REPLAY_ORCHESTRATOR_URL: http://replay-orchestrator:8000
      ADVERSARIAL_FOUNDRY_URL: http://adversarial-foundry:8000
      CAUSAL_ENGINE_URL: http://causal-engine:8000
      CERTIFIER_URL: http://certifier:8000
      WATCHTOWER_URL: http://watchtower:8000
      WATCHTOWER_RELAY_URL: http://watchtower-relay:8000
      SIGNOZ_MCP_URL: http://signoz-mcp:8000/mcp
      SIGNOZ_CLICKHOUSE_URL: http://orbital-telemetrystore-clickhouse-0-0:8123
      SIGNOZ_PUBLIC_URL: http://localhost:8080
      ORBITAL_WEBHOOK_SECRET: ${ORBITAL_WEBHOOK_SECRET:-development-only}
      MOCK_MCP_URL: http://mock-mcp-tool:8000
      MOCK_REFUND_URL: http://mock-refund-service:8000
      ORBITAL_DEMO_OUTPUT: /workspace/data/demo-output
    volumes:
      - ../data:/workspace/data
      - ../missions:/workspace/missions
      - ../secrets:/workspace/secrets
      - ../.env:/workspace/.env
    networks: [orbital, signoz]

  obi:
    image: otel/ebpf-instrument:v0.10.0
    profiles: ["obi"]
    init: true
    pid: host
    privileged: true
    environment:
      OTEL_EBPF_CONFIG_PATH: /etc/obi/config.yaml
      OTEL_EBPF_ENFORCE_SYS_CAPS: "true"
      OTEL_EBPF_KUBE_METADATA_ENABLE: "false"
    volumes:
      - ../collector/obi-config.yaml:/etc/obi/config.yaml:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /sys/fs/bpf:/sys/fs/bpf
    networks: [orbital]

networks:
  orbital: { name: orbital-sigma }
  signoz:
    external: true
    name: orbital-network

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-data:
